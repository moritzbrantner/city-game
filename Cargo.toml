[workspace]
members = [
  "crates/city-game-core",
  "crates/city-game-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/moritzbrantner/city-game"

[workspace.dependencies]
geo-core = { package = "moenarch-geo-core", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "7b0274eb10339c7f2c3537e76cef9b41bae26f9e" }
geo-io-osm = { package = "moenarch-geo-io-osm", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "7b0274eb10339c7f2c3537e76cef9b41bae26f9e" }
protobuf = "=3.7.2"
osmpbfreader = "=0.19.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde-json = { package = "serde_json", version = "=1.0.151" }
sha2 = "=0.11.0"
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "5340bdf31de6761ed16737dd6d19da2431172fd6" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "5340bdf31de6761ed16737dd6d19da2431172fd6" }
