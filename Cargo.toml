[workspace]
members = [
  "crates/city-game-core",
  "crates/city-game-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/moritzbrantner/city-game"

[workspace.dependencies]
geo-core = { package = "moenarch-geo-core", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "e0130ddbba537bba4ac2936fee203d01728e2daf" }
geo-io-osm = { package = "moenarch-geo-io-osm", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "e0130ddbba537bba4ac2936fee203d01728e2daf" }
protobuf = "=3.7.2"
osmpbfreader = "=0.19.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde-json = { package = "serde_json", version = "=1.0.154" }
sha2 = "=0.11.1"
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "743e79a17ab3a49770c342810f5510db12eb98b8" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "743e79a17ab3a49770c342810f5510db12eb98b8" }
