[workspace]
members = [
  "crates/city-game-core",
  "crates/city-game-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/moritzbrantner/city-game"

[workspace.dependencies]
geo-core = { package = "moenarch-geo-core", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "f0dfc124763aa830f744430112a3ca41b0efe738" }
geo-io-osm = { package = "moenarch-geo-io-osm", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "f0dfc124763aa830f744430112a3ca41b0efe738" }
protobuf = "=3.7.2"
osmpbfreader = "=0.19.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde-json = { package = "serde_json", version = "=1.0.154" }
sha2 = "=0.11.2"
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "1d185c64fa82dc270e0fd0685d77157ef5c59142" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "1d185c64fa82dc270e0fd0685d77157ef5c59142" }
