[workspace]
members = [
  "crates/city-game-core",
  "crates/city-game-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/moritzbrantner/city-game"

[workspace.dependencies]
geo-core = { package = "moenarch-geo-core", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "5c22087182bb26e0b84194bb70398313547c2cde" }
geo-io-osm = { package = "moenarch-geo-io-osm", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "c4df63a023f2183d700a9a28071d732d345e7c25" }
protobuf = "=2.28.0"
osmpbfreader = "=0.16.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde-json = { package = "serde_json", version = "=1.0.151" }
sha2 = "=0.10.9"
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "6a18cb2d1fe9efdbae619c144b2180fdeb472172" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "6a18cb2d1fe9efdbae619c144b2180fdeb472172" }
