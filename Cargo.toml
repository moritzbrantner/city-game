[workspace]
members = [
  "crates/city-game-core",
  "crates/city-game-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/moritzbrantner/city-game"

[workspace.dependencies]
geo-core = { package = "moenarch-geo-core", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "2e08f8ecd3a41239f111e87f462492005104a906" }
geo-io-osm = { package = "moenarch-geo-io-osm", git = "https://github.com/moritzbrantner/geo-analysis.git", rev = "2e08f8ecd3a41239f111e87f462492005104a906" }
protobuf = "=3.7.2"
osmpbfreader = "=0.19.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde-json = { package = "serde_json", version = "=1.0.154" }
sha2 = "=0.11.1"
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "6bd382d81687a33633e927f69258726f0b85c296" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "6bd382d81687a33633e927f69258726f0b85c296" }
