name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust with locked dependencies
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust with locked dependencies
        run: cargo test --locked --workspace --all-features

      - name: Generate browser renderer frame
        run: cargo run --locked -p city-game-cli -- frame fixtures/demo-scenario.json web/public/demo-frame.json

      - name: Install locked browser dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build browser proof
        working-directory: web
        run: bun run build
