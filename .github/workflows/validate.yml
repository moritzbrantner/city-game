name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust with locked dependencies
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust with locked dependencies
        run: cargo test --locked --workspace --all-features

      - name: Run deterministic performance smoke contract
        run: bash scripts/performance-smoke.sh

      - name: Check browser WASM target
        run: cargo check --locked -p city-game-core --target wasm32-unknown-unknown

  build-pages:
    name: Build or reuse deployable browser proof
    needs: validate
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@28a77d034ce18595e5f058f81e8063ea67d23bd9
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: city-game-pages-v1
      rust_toolchain: stable
      rust_targets: wasm32-unknown-unknown
      bun_version: latest
      cache_bun: true
      bun_cache_dependency_path: web/bun.lock
      build_command: bash scripts/build-pages.sh
      artifact_paths: web/dist
      reuse_across_runs: true
      artifact_retention_days: 7

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: [validate, build-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["validate", "build-pages"]'
