name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust with locked dependencies
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust with locked dependencies
        run: cargo test --locked --workspace --all-features

      - name: Run deterministic performance smoke contract
        run: bash scripts/performance-smoke.sh

      - name: Check browser WASM target
        run: cargo check --locked -p city-game-core --target wasm32-unknown-unknown

  build-pages:
    name: Build or reuse deployable browser proof
    needs: validate
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@28a77d034ce18595e5f058f81e8063ea67d23bd9
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: city-game-pages-v1
      rust_toolchain: "1.98.0"
      rust_targets: wasm32-unknown-unknown
      bun_version: "1.3.14"
      cache_bun: true
      bun_cache_dependency_path: web/bun.lock
      build_command: bash scripts/build-pages.sh
      artifact_paths: web/dist
      reuse_across_runs: true
      artifact_retention_days: 7
