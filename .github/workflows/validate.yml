name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Format Rust for bootstrap evidence
        run: cargo fmt --all

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --all-features

      - name: Generate browser renderer frame
        run: cargo run -p city-game-cli -- frame fixtures/demo-scenario.json web/public/demo-frame.json

      - name: Install browser dependencies
        working-directory: web
        run: bun install

      - name: Build browser proof
        working-directory: web
        run: bun run build

      - name: Commit canonical bootstrap outputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock web/bun.lock crates/city-game-core/src crates/city-game-cli/src
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock foundation dependencies"
            git push origin "HEAD:${HEAD_REF}"
          fi
